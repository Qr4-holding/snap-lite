plugins { id 'com.android.application' }
def ks = new Properties(); file('../keystore.properties').withInputStream { ks.load(it) }
android {
  namespace '@APP_ID@'
  compileSdk 34
  defaultConfig { applicationId '@APP_ID@'; minSdk 21; targetSdk 34; versionCode @VCODE@; versionName '@VNAME@' }
  signingConfigs { release { storeFile file(ks.storeFile); storePassword ks.storePassword; keyAlias ks.keyAlias; keyPassword ks.keyPassword } }
  buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0' }
